<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700" role="img" aria-labelledby="t d"><title id="t">Inbox support workflow</title><desc id="d">Illustration of a support inbox with priority, category, drafted response, and escalation status.</desc><rect width="1080" height="700" rx="28" fill="#dfe8ee"/><text x="64" y="76" fill="#536c7a" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">TRIAGE / DRAFT / ESCALATE</text><text x="64" y="134" fill="#17241e" font-family="Arial,sans-serif" font-size="42" font-weight="700">Inbox Support Workflow</text><rect x="64" y="190" width="952" height="408" rx="22" fill="#fffdf8"/><rect x="88" y="214" width="310" height="360" rx="16" fill="#f0f3f2"/><text x="112" y="250" fill="#667069" font-family="Arial,sans-serif" font-size="14" font-weight="700">QUEUE</text><g font-family="Arial,sans-serif"><rect x="112" y="274" width="262" height="72" rx="12" fill="#fff"/><circle cx="136" cy="300" r="8" fill="#e6a180"/><text x="154" y="304" fill="#28342e" font-size="15" font-weight="700">Order question</text><text x="154" y="326" fill="#77817b" font-size="13">Needs account details</text><rect x="112" y="360" width="262" height="72" rx="12" fill="#fff"/><circle cx="136" cy="386" r="8" fill="#b9d6b2"/><text x="154" y="390" fill="#28342e" font-size="15" font-weight="700">General question</text><text x="154" y="412" fill="#77817b" font-size="13">FAQ response ready</text><rect x="112" y="446" width="262" height="72" rx="12" fill="#fff"/><circle cx="136" cy="472" r="8" fill="#c6bdd2"/><text x="154" y="476" fill="#28342e" font-size="15" font-weight="700">Technical issue</text><text x="154" y="498" fill="#77817b" font-size="13">Collect reproduction steps</text></g><rect x="430" y="214" width="558" height="360" rx="16" fill="#17241e"/><text x="458" y="252" fill="#c9d5ce" font-family="Arial,sans-serif" font-size="14" font-weight="700">DRAFT RESPONSE</text><text x="458" y="302" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Thanks for reaching out.</text><g fill="#fff" opacity=".16"><rect x="458" y="330" width="470" height="16" rx="6"/><rect x="458" y="360" width="438" height="16" rx="6"/><rect x="458" y="390" width="486" height="16" rx="6"/><rect x="458" y="420" width="368" height="16" rx="6"/></g><rect x="458" y="474" width="138" height="42" rx="21" fill="#dfe9dd"/><text x="486" y="501" fill="#17241e" font-family="Arial,sans-serif" font-size="14" font-weight="700">Ready to send</text><rect x="612" y="474" width="132" height="42" rx="21" fill="#f4ddd1"/><text x="642" y="501" fill="#17241e" font-family="Arial,sans-serif" font-size="14" font-weight="700">Escalate</text></svg>